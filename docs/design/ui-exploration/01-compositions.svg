<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1420" viewBox="0 0 1600 1420" role="img" aria-labelledby="title desc">
<title id="title">GrantPath: three different workbench compositions</title>
<desc id="desc">Static phase one planning wireframes: an annotated dossier, the selected Evidence Desk, and a funding register. Illustrative synthetic labels, no implemented application.</desc>
<defs><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#15213B} .h{font:36px Georgia,serif}.sub{font-size:18px;fill:#52617A}.label{font-size:15px;font-weight:600}.body{font-size:19px}.small{font-size:16px}.white{fill:#E9EFFB}.blue{fill:#2447D8}.muted{fill:#52617A}.serif{font-family:Georgia,serif}.line{stroke:#CCD5E4;stroke-width:2}.rule{stroke:#2447D8;stroke-width:4}</style></defs>
<rect width="1600" height="1420" fill="#EFF3F9"/>
<text x="48" y="58" class="h">Three ways to organize a research decision</text>
<text x="48" y="93" class="sub">GRANTPATH / PHASE 1 / STATIC PLANNING STUDIES / ILLUSTRATIVE SYNTHETIC LABELS</text>
<!-- A: page-centric, not tiles -->
<rect x="48" y="130" width="1504" height="370" rx="6" fill="#FFFFFF"/>
<text x="76" y="170" class="body" font-weight="700">A / Annotated dossier</text>
<rect x="76" y="195" width="860" height="275" fill="#F6F8FC" stroke="#CCD5E4"/>
<path d="M238 195V470M742 195V470" class="line"/>
<text x="92" y="228" class="label">FOLIO</text><text x="92" y="265" class="small">01 Summary</text><text x="92" y="303" class="small blue">02 Methods</text><text x="92" y="341" class="small">03 Response</text>
<text x="266" y="234" class="body serif">Methods / retained revision</text>
<text x="266" y="270" class="small">A broad reading page with numbered</text><text x="266" y="296" class="small">passages, evidence footnotes and margin</text><text x="266" y="322" class="small">annotations beside the current paragraph.</text>
<path d="M266 350H707M266 373H675M266 396H707M266 419H621" class="line"/>
<text x="761" y="239" class="label">[1] SOURCE V2</text><text x="761" y="273" class="small">Retained quote</text><text x="761" y="300" class="small">Original file v1</text><path d="M761 323H914" class="line"/><text x="761" y="354" class="small">[2] Review note</text><text x="761" y="382" class="small">Missing support</text>
<text x="972" y="228" class="body">Dominant unit: a document</text>
<text x="972" y="268" class="small">Best for sustained writing and close reading.</text>
<text x="972" y="301" class="small">A meaningful citation margin, not a card grid.</text>
<text x="972" y="354" class="label">LIMIT</text><text x="972" y="387" class="small">Repeated state changes become footnotes.</text><text x="972" y="416" class="small">Ledger/import work needs another grammar.</text>
<!-- B: one active decision with optional source companion -->
<rect x="48" y="524" width="1504" height="390" rx="6" fill="#FFFFFF" stroke="#2447D8" stroke-width="3"/>
<text x="76" y="565" class="body" font-weight="700">B / Evidence Desk</text><text x="292" y="565" class="label blue">SELECTED</text>
<rect x="76" y="590" width="860" height="294" fill="#FFFFFF" stroke="#CCD5E4"/>
<rect x="76" y="590" width="155" height="294" fill="#15213B"/>
<text x="92" y="624" class="body white serif">GrantPath</text><text x="92" y="666" class="small white">Project &amp; sources</text><text x="92" y="705" class="small white">Proposal</text><rect x="76" y="723" width="155" height="41" fill="#2447D8"/><text x="92" y="750" class="small white">Revision &amp; review</text><text x="92" y="795" class="small white">Award &amp; progress</text>
<rect x="231" y="590" width="705" height="43" fill="#F6F8FC"/><text x="249" y="617" class="label">Application / target cycle / saved scope</text>
<path d="M674 633V884" class="line"/><text x="249" y="667" class="body serif">What needs review now?</text>
<path d="M250 687H650" class="rule"/><text x="249" y="718" class="small">Concern → shared action</text>
<path d="M272 732V780M272 751H300M272 780H300" fill="none" stroke="#8392AC" stroke-width="2"/>
<text x="312" y="757" class="small">Evidence / exact source v2</text><text x="312" y="786" class="small">Target / saved Methods revision</text>
<rect x="249" y="808" width="402" height="54" fill="#FFF1D5"/><text x="261" y="840" class="small" fill="#805100">Changed dependency → inspect, then review</text>
<text x="692" y="669" class="label">SOURCE FOLIO</text><text x="692" y="705" class="small">Pinned v2</text><text x="692" y="735" class="small">Latest v3 separate</text><path d="M692 760H916M692 784H891M692 808H914" class="line"/>
<text x="972" y="626" class="body">Dominant unit: a decision</text><text x="972" y="666" class="small">One active concern, term, section or record.</text><text x="972" y="699" class="small">Its exact support stays within reach.</text>
<text x="972" y="751" class="label">RULES</text><text x="972" y="784" class="small">No fourth permanent column.</text><text x="972" y="813" class="small">Browsing a version never accepts it.</text><text x="972" y="842" class="small">Selection never discards editor buffers.</text>
<!-- C: register-centric -->
<rect x="48" y="938" width="1504" height="370" rx="6" fill="#FFFFFF"/>
<text x="76" y="979" class="body" font-weight="700">C / Funding register</text>
<rect x="76" y="1004" width="860" height="274" fill="#FFFFFF" stroke="#CCD5E4"/>
<text x="94" y="1038" class="label">Award / period / pinned terms</text><rect x="76" y="1056" width="860" height="37" fill="#15213B"/>
<text x="94" y="1081" class="label white">Record</text><text x="325" y="1081" class="label white">Proposed</text><text x="477" y="1081" class="label white">Approved</text><text x="634" y="1081" class="label white">Actual</text><text x="769" y="1081" class="label white">Source</text>
<text x="94" y="1126" class="small">Budget line / scope</text><text x="325" y="1126" class="small">Separate</text><text x="477" y="1126" class="small">Separate</text><text x="634" y="1126" class="small">Unknown</text><text x="769" y="1126" class="small">Terms v2</text><path d="M76 1145H936" class="line"/>
<rect x="76" y="1145" width="860" height="45" fill="#EDF1FF"/><text x="94" y="1174" class="small blue">Selected record expands across full width ↓</text><text x="94" y="1220" class="small">Exact period, basis, retained source and local review</text><text x="94" y="1252" class="small muted">No sum of opportunity maxima masquerading as secured money.</text>
<text x="972" y="1038" class="body">Dominant unit: a linked record</text><text x="972" y="1078" class="small">Strong exact comparisons and omissions.</text><text x="972" y="1111" class="small">Borrow this grammar for finance and files.</text>
<text x="972" y="1164" class="label">LIMIT</text><text x="972" y="1197" class="small">Long scientific prose becomes a detour.</text><text x="972" y="1226" class="small">An administrative opening hides revision value.</text>
<text x="48" y="1360" class="sub">Choose B; borrow A’s reading folio and C’s register only where the actual task benefits.</text>
<text x="48" y="1393" class="small muted">Proposed composition only. No app code, accepted design system, generated result or runtime acceptance.</text>
</svg>
