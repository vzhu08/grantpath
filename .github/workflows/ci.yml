name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: "1"
  RUN_LIVE_AI: "false"
  AI_PROVIDER: ""
  AI_MODEL: ""
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""

jobs:
  validate:
    name: Validate (types, tests, build, browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.12.0"
          cache: npm
      - name: Verify merge automation policy
        run: node --test .github/scripts/merge-policy.checks.mjs
      - name: Validate GitHub workflow syntax
        run: bash .github/scripts/check-workflows.sh
      - name: Install the locked dependencies
        run: npm ci --no-fund
      - name: Check dependency advisories
        run: npm audit --audit-level=high
      - name: Set up the pinned numerical interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
      - name: Set up the official R reference
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: "4.6.1"
          Ncpus: "1"
          use-public-rspm: "false"
      - name: Install and identify exact Linux numerical artifacts
        run: |
          mkdir -p .test-data/aimfit/temp test-results/aimfit
          python -m pip download --only-binary=:all: --no-deps --require-hashes --dest .test-data/aimfit-wheels -r .github/aimfit-linux-requirements.txt
          python -m pip install --force-reinstall --no-index --only-binary=:all: --no-deps --require-hashes --find-links .test-data/aimfit-wheels --report test-results/aimfit/pip-install.json -r .github/aimfit-linux-requirements.txt
          python -I -B .github/scripts/aimfit-ci-manifest.py
          python -m pip inspect > test-results/aimfit/pip-inspect.json
          printf 'AIMFIT_PYTHON=%s\n' "$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Compare the production primitive to the official R oracle
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          Rscript --vanilla modules/aimfit/reference/oracle.R 4.6.1 > test-results/aimfit/oracle.csv 2> test-results/aimfit/r-session.txt
          python -I -B scripts/aimfit-compare-oracle.py test-results/aimfit/oracle.csv 4.6.1 > test-results/aimfit/comparison.json
          python -I -B scripts/aimfit-compare-oracle.py .github/fixtures/aimfit-r-4.6.1.csv 4.6.1 > test-results/aimfit/captured-reference-comparison.json
          python -I -B tests/aimfit/numeric_protocol_test.py
      - name: Typecheck, test, and build
        run: npm run check
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Exercise the local browser journey
        run: npm run test:browser
      - name: Exercise immutable vault uploads and handoffs
        run: node scripts/vault-browser.mjs
        env:
          GRANTPATH_TEST_PORT: "3102"
      - name: Exercise resubmission review and retained packets
        run: node --import tsx scripts/resubmissions-acceptance.ts
        env:
          GRANTPATH_TEST_PORT: "3103"
      - name: Verify ordered frozen responses through restart
        run: node --import tsx scripts/resubmissions-acceptance.ts
        env:
          GRANTPATH_TEST_PORT: "3103"
          GRANTPATH_PACKET_ONLY: "true"
      - name: Exercise award progress and immutable worksheets
        run: node --import tsx scripts/awards-acceptance.ts
        env:
          GRANTPATH_TEST_PORT: "3105"
      - name: Retain test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
